name: Build BL602 1MB
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build_bl602:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build OpenBL602 1MB
        run: |
          make APP_VERSION=1MB_build APP_NAME=OpenBL602 VARIANT="default" OpenBL602

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: OpenBL602_1MB_Firmware
          path: output/1MB_build/*.bin
